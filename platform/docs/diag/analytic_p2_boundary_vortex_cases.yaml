  data_fingerprint:
    actual_body_frozen_order_abs_change: 1.7472172799657516e-9
    actual_wake_frozen_order_abs_change: 6.318586451029411e-9
    manufactured_q16_to_q24_abs_change: 1.769196738995049e-2
    constant_ring_abs_error: 5.25238844229392e-4
  node: N3.1j3b6d18c2b3a2
  movable_space: >
    Replace only the numerical boundary-vortex edge integral by its exact
    quadratic polynomial moments.  Keep the area-vorticity finite-part
    identity and use the already preregistered target-sinh coordinates only
    on that remainder.
  classification: missing_analytic_strong_singularity_extraction

primary_evidence:
  - source: Johnson, NASA CR-3079 (1980), Appendix D
    url: https://ntrs.nasa.gov/citations/19800015776
    implication: >
      Higher-order polynomial doublet velocity influence coefficients are
      computed from closed H/F integral recursions.
  - source: Krebs dissertation (2021), Appendix A
    implication: >
      DDE quadratic strength coefficients multiply Johnson H(M,N,K)-based
      velocity influences rather than an empirical core.
  - source: >
      Montanelli, Aussal & Haddar, SIAM Journal on Scientific Computing 44
      (2022), Theorem 2.1
    url: https://arxiv.org/abs/2111.13151
    implication: >
      Transplanting alone retains only exponential convergence for higher
      singular powers; analytic subtraction lowers the singular order before
      quadrature.

candidate_rewrite:
  edge_polynomial: "mu(s)=A*s^2+B*s+C, exactly reconstructed from P2 edge nodes"
  local_coordinate: >
    With unit tangent t, length L, unbounded line projection s*, transverse
    vector r_perp and u=L*(s-s*), integrate q0+q1*u+q2*u^2 against
    (u^2+a^2)^(-3/2) using exact endpoint primitives I0/I1/I2.
  exact_primitives:
    I0: "u/(a^2*sqrt(u^2+a^2))"
    I1: "-1/sqrt(u^2+a^2)"
    I2: "asinh(u/a)-u/sqrt(u^2+a^2)"
  invariants:
    - "analytic plus remainder equals the original doublet identity"
    - "constant P2 strength equals the oriented finite vortex ring"
    - "no offset, core, excluded disk or target load"
    - "proper rigid transforms rotate the vector result"
    - "targets on an edge fail closed"

