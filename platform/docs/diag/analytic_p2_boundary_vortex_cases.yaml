question: >
  Does exact analytic integration of the complete quadratic P2 boundary
  vortex on every straight edge remove the unresolved 1/r^3 near-vertex
  layer, leaving the already finite-part area-vorticity remainder convergent
  under target-transplanted Gauss, without changing the doublet sheet?

