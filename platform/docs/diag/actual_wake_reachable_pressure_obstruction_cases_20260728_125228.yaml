role: no_force_reachable_path_dynamic_residual_witness

question: >
  Along the already validated fixed-body explicit-midpoint material-wake
  path, with every old material P2 row retained and every current trace
  solved from the complete actual body equation plus attachment
  compatibility, is the unforced weak unsteady-pressure residual tangent
  zero for a physical incidence-history perturbation? If it is stably
  nonzero, the result is only a named reachable-path obstruction witness;
  it is not a forming-state identity or dimension result.

cause:
  data_fingerprint:
    - >
      S3ag proved that arbitrary birth forcing and steady pressure roots do
      not guarantee body-wake compatibility.
    - >
      The aborted S3ah map G_A was rank seven by the already frozen Morino
      Schur identity, independent of pressure, dt and history basis.
    - >
      S3e already supplies a typed physical input path with old material
      rows immutable, half/full actual solves, chronological newborn bands
      and a convergent body-cut trace; its pressure residual has never been
      observed.
  node: N3.1j3b6d18c2b3b3b2c2b2b3e3b
  movable_space: >
    Add only a read-only pressure-rate observation and direct independent-W
    audit to the frozen S3e path. Do not change its body equation, material
    history, prescribed convection, midpoint rule, topology, quadrature
    semantics, pressure formula, N1/N4, force or production code.
  classification_to_test:
    - zero_extra_state_pressure_law_is_tangent_on_this_reachable_path
    - named_pressure_law_has_a_nonzero_reachable_obstruction
    - path_or_discretization_is_not_converged_enough_to_decide

primary_evidence:
  - source: >
      Dumoulin, Eldredge & Chatelain, Journal of Fluid Mechanics 977
      (2023), DOI 10.1017/jfm.2023.997.
    implication: >
      No-through-flow, Kelvin transfer and unsteady Kutta are distinct
      constraints in one time-consistent panel system; a Kutta residual
      must be observed on histories generated by the same solve.
  - source: >
      Xia & Mohseni, Journal of Fluid Mechanics 830 (2017),
      DOI 10.1017/jfm.2017.513.
    implication: >
      The massless sharp-edge rate jointly depends on side velocities,
      sheet strength, relative speed and forming direction; an arbitrary
      previous-trace mode is not a physical forcing.
  - source: >
      DeVoria & Mohseni, Journal of Fluid Mechanics 866 (2019),
      DOI 10.1017/jfm.2019.134.
    implication: >
      A finite forming-zone state, if later required, must carry independent
      surface mass, momentum and entrainment balances; a nonzero residual
      alone cannot authorize it.

canonical:
  body: "frozen symmetric full-wing diamond actual-boundary canonical"
  wall_velocity: "zero"
  initial_body_cut_jump: "zero complete nine-node trace"
  incident_history: >
    alpha(t;epsilon)=epsilon*sin(pi*t/T), U=1, with plus/minus epsilon
    paths generated by the same actual solver.
  physical_time: {start: 0.0, end: 1.0}
  prescribed_material_convection_speed: 1.0
  trailing_edge_x: 1.0
  span_diagonal_pattern: mirror_symmetric
  body_boundary_quadrature_order: 10
  direct_w_quadrature_order: 10
  pressure_line_quadrature_order: 12
  active_trace:
    complete_p2_nodes: 9
    essential_zero_tip_nodes: 2
    independent_nodes: 7
    mass: >
      M_active is the active-active principal block of the same consistent
      complete P2 line mass used by the weak pressure observation.

reachable_path:
  generator: march_actual_boundary_material_wake_explicit_midpoint
  inherited_identities:
    - "old material strengths remain bitwise immutable"
    - "half row comes from the half-time coupled actual solve"
    - "full row comes from the full-time coupled actual solve"
    - "newborn rows are [g_previous,g_midpoint,g_current]"
    - "old histories are known RHS data, not current unknowns"
  trace_coordinates: >
    Use the classified active-row order. Report the complete zero-tip rows
    and body compatibility at previous, midpoint and current stages.
  direct_body_equation: "B_k phi_k + W_direct,k g_k = b_k"
  kelvin_ledger: >
    With repository identity Gamma_bound=-mu and birth sign +1, each two
    half-step release contributes Delta Gamma_wake =
    (g_mid-g_previous)+(g_current-g_mid). Require
    -g_current + sum(Delta Gamma_wake) + g_initial = 0 at every step and
    old material P2 rows unchanged. This is a typed potential-jump Kelvin
    ledger, not an independent forming-zone inventory.

named_dynamic_observation:
  weak_pressure: >
    P_mid = f_active[0.5*(|w_upper|^2-|w_lower|^2)] evaluated from the
    midpoint compatible state using the frozen weak active-P2 line map.
  step_residual: >
    R_P,n = M_active*(g_current-g_previous) + dt*P_mid.
  window_residual: "R_P,window = sum_n R_P,n"
  dual_mass_norm: "||R||_(M^-1)=sqrt(R^T M_active^-1 R)"
  notes:
    - "the trace difference is the potential-rate term multiplied by dt"
    - "pressure is never integrated into panel or total force"
    - "no manufactured previous trace or pressure root is used"

families:
  epsilon_centered:
    timestep: 0.125
    positive_epsilon_rad: [0.02, 0.01, 0.005, 0.0025]
    definition: >
      Omega_epsilon =
      [R_window(+epsilon)-R_window(-epsilon)]/(2*epsilon).
    cauchy: >
      Compare successive Omega_epsilon vectors in the dual mass norm; a
      smooth centered tangent has second-order epsilon remainder.
  timestep_centered:
    epsilon_rad: 0.01
    timestep: [0.25, 0.125, 0.0625]
    definition: >
      Compare Omega_dt at the common physical end time. The midpoint
      dynamic observation and compatible trace must show second-order
      Cauchy before a nonzero limit is accepted.
  zero_reference_quadrature:
    alpha_deg: 0.0
    boundary_orders: [5, 8, 10, 12]
    line_order: 12
    purpose: >
      The zero-reference weak kinetic residual must converge toward zero;
      it is a numerical floor and is never subtracted as an offset.

required_identities:
  - "all previous/midpoint/current stages satisfy the direct full body BIE"
  - "all stages satisfy g-Cphi compatibility and essential zero-tip traces"
  - "direct W has seven independent columns and matches the eliminated block"
  - "old material strengths, chronology, attachment and midpoint identities pass"
  - "the typed bound+wake Kelvin telescoping ledger closes with repository sign"
  - "zero-reference pressure decreases with quadrature and reaches its frozen floor"
  - "centered epsilon tangent has second-order Cauchy"
  - "centered timestep tangent has second-order Cauchy"
  - "nonzero/zero classification is made only relative to frozen numerical uncertainty"
  - "no pressure root, least squares, force, target data or forming-state variable enters"

thresholds:
  direct_full_bie_relative_residual_max: 2.0e-11
  compatibility_abs_max: 2.0e-11
  zero_tip_abs_max: 2.0e-12
  direct_w_factorization_abs_max: 5.0e-11
  direct_w_rank_deficiency_max: 0
  old_state_mutation_abs_max: 0.0
  history_time_gap_abs_max: 2.0e-12
  history_geometry_gap_abs_max: 2.0e-12
  history_trace_jump_abs_max: 2.0e-12
  midpoint_identity_abs_max: 2.0e-12
  current_attachment_abs_max: 2.0e-12
  kelvin_ledger_abs_max: 2.0e-12
  zero_reference_pressure_finest_abs_max: 1.0e-6
  zero_reference_pressure_strictly_decreasing: true
  epsilon_tangent_cauchy_ratio_min: 3.2
  timestep_tangent_cauchy_ratio_min: 3.2
  nonzero_witness_to_uncertainty_ratio_min: 100.0
  near_zero_to_uncertainty_ratio_max: 10.0
  input_mutation_abs_max: 0.0

numerical_uncertainty:
  definition: >
    The maximum of: finest zero-reference pressure in the dual mass norm,
    finest epsilon tangent change, finest timestep tangent change,
    direct-BIE/compatibility/Kelvin residuals mapped to the same dual mass
    scale, and deterministic repeat difference. No force tolerance enters.

decision:
  reachable_obstruction_witness_go: >
    Every representation/Kelvin/Cauchy gate passes and the finest centered
    tangent norm is at least 100 times the frozen numerical uncertainty.
    Falsify only tangency of this named weak pressure law on this one
    prescribed-convection reachable path. Open component localization;
    do not infer a state or its dimension.
  no_obstruction_witness: >
    Every gate passes and the tangent norm is at most 10 times uncertainty.
    This one path supplies no first-order obstruction. It does not validate
    zero-state closure on other motions, actual roll-up or finite-base
    geometry.
  no_go: >
    Any direct-W, BIE, compatibility, Kelvin, chronology, epsilon-order,
    timestep-order or uncertainty-separation failure blocks a physical
    conclusion. Diagnose the named representation component; do not relax a
    threshold, add a state, pressure solve, regularizer or load target.
  production_activation_allowed: false

nonclaims:
  - "This path has prescribed uniform convection, not actual newborn roll-up."
  - "One incidence direction does not identify the rank of the full reachable map."
  - "A nonzero obstruction does not distinguish forming geometry from VES."
  - "No pressure force, LEV amplitude, flap-cycle load, 118 sweep or Fig17/18/19 result is produced."

