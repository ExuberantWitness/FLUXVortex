decision:
  go: >
    All mapping, analytic constant-ring, independent-reference, finite-order
    Cauchy, actual S3n snapshot, rigid-objectivity and fail-closed gates pass.
    Freeze only the target-aware edge quadrature and authorize rerunning S3n;
    do not yet authorize wake relaxation.
  no_go: >
    Any failure preserves c2b3a as partial.  Do not increase the frozen
    orders, relax thresholds, omit a source, offset the target, add a core or
    consult pressure/force targets.
  production_activation_allowed: false

forbidden:
  - geometry_update
  - material_mu_transport
  - wake_relaxation
  - fixed_point
  - target_offset
  - vortex_core
  - smoothing
  - pressure
  - force
  - LESP
  - target_load
  - structural_dynamics

execution:
  result_file: near_singular_p2_edge_quadrature_results.json
  decision: NO-GO
  interpretation: >
    The simple sinh map preserves regular fields, passes the actual S3n
    frozen-order ledger, objectivity and fail-closed semantics, but it does
    not remove the 1/r^3 boundary-vortex singular power.  At the stronger
    manufactured near-vertex point the q16-to-q24 change is 1.77e-2 and the
    analytic constant-ring error is 5.25e-4.  The map is therefore frozen as
    falsified rather than promoted from its favorable actual-snapshot result.
