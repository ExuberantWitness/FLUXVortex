question: >
  After the already-validated analytic radial reduction and on-sheet
  finite-part cancellation, can a target-centered, parameter-free sinh
  coordinate on each remaining edge integral recover near-edge and
  near-vertex P2 doublet velocities at finite order, without changing the
  integral or introducing an offset, vortex core, pressure or force target?

cause_from_s3n:
  data_fingerprint:
    body_last_abs_change_q52_to_q72: 9.477818447017105e-3
    wake_last_abs_change_q64_to_q80: 3.416391363242956e-3
    worst_barycentric: [0.03333333333333333, 0.03333333333333333, 0.9333333333333333]
    body_normal_distance_over_sqrt_2_area: 3.2367096363748885e-3
    wake_q192_to_q256_abs_change: 1.1855094544044204e-9
  interpretation: >
    The physical four-channel sum, owner identity, topology, representation
    and objectivity pass.  Ordinary edge Gauss has a target-dependent
    near-singular layer and does not reach the preregistered tolerance.
  node: N3.1j3b6d18c2b3a1
  movable_space: >
    Change only the coordinate and weights of the remaining one-dimensional
    edge quadrature.  Preserve the P2 density, radial primitives,
    finite-part identity, source identities and every physical state.
  classification: missing_target_aware_near_singular_quadrature

primary_evidence:
  - source: Johnson, NASA CR-3079 (1980)
    url: https://ntrs.nasa.gov/citations/19800015776
    implication: >
      Polynomial source and doublet influence coefficients admit closed-form
      H/F recursions rather than brute-force ordinary surface quadrature.
  - source: >
      Montanelli, Aussal & Haddar, SIAM Journal on Scientific Computing 44
      (2022)
    url: https://arxiv.org/abs/2111.13151
    implication: >
      Near singularities on quadratic triangles require locating the
      singular preimage and using subtraction/continuation with transplanted
      Gauss; ordinary Gauss loses rapid convergence as the target approaches.
  - source: >
      Montanelli, Collino & Haddar, SIAM Journal on Scientific Computing 46
      (2024)
    doi: https://doi.org/10.1137/23M1605594
    implication: >
      The same target-aware construction extends to strongly singular
      kernels and quadratic triangular elements.
  - source: >
      Johnston, Johnston & Elliott, Journal of Computational and Applied
      Mathematics 245 (2013)
    doi: https://doi.org/10.1016/j.cam.2012.12.018
    implication: >
      A projection-centered sinh coordinate resolves nearly singular
      triangular BEM integrals without changing their kernel.

candidate_rewrite:
  coordinate: >
    For an edge x(s)=x0+s*e, compute s0 as the closest-segment coordinate of
    the target, d=|target-x(s0)|/|e|, and map
    s=s0+d*sinh(t), with exact endpoint images and Jacobian
    ds/dt=d*cosh(t).
  invariants:
    - "the transformed weights integrate over exactly s in [0,1]"
    - "no target offset or excluded disk"
    - "no vortex core or smoothing"
    - "analytic radial and finite-part algebra unchanged"
    - "proper rigid transforms leave s0, d and vector rotation invariant"
    - "a target exactly on an edge fails closed"

