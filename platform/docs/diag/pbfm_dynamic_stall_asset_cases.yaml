version: 1
audit_date: "2026-07-28"
decision_scope: >
  Determine whether the public PBFM dynamic-stall HDF5 files can supply the
  independent near-wall time-resolved volume-velocity evidence required by
  N2.6b4f3, and separately record any narrower role that their released
  surface-time fields can legitimately support.
