  generation:
    equations: "unsteady compressible two-dimensional RANS"
    solver: "ANSYS Fluent 2024R2"
    geometry: "sinusoidally pitching NACA0012"
    turbulence_transition: "SST turbulence model with intermittency transport"
    native_mesh: "O-grid, 512 surface nodes x 128 wall-normal nodes"
    timesteps_per_cycle: 2048
    mach_range: [0.3, 0.5]
    alpha_mean_deg_range: [5.0, 10.0]
    alpha_amplitude_deg_range: [5.0, 10.0]
    reduced_frequency_range: [0.05, 0.1]
    reynolds_identity: >
      Reynolds number is not one of the four released conditioning variables
      and is not stated as a target-Re identity in the PBFM dataset card.
  released_representation:
    topology: >
      128 x 128 surface-location-by-cycle-phase arrays, downsampled from the
      CFD solution; these are not 128 x 128 Cartesian or O-grid volume fields.
    raw_channels: 8
    physical_channels:
      - absolute_pressure
      - x_tangential_velocity_gradient_at_wall
      - y_tangential_velocity_gradient_at_wall
      - temperature
      - density
      - signed_wall_shear_stress
    geometry_channels:
      - surface_tangent_cosine
      - surface_tangent_sine
    explicit_volume_velocity_components: []
    explicit_volume_coordinates: []
    explicit_time_coordinate_array: false
    train_nominal_conditions: 128
    test_nominal_conditions: 16
    perturbed_samples_per_condition: 32
