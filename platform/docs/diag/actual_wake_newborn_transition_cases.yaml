  rigid_geometry_abs_max: 2.0e-14
  rigid_release_velocity_abs_max: 2.0e-13
  rigid_topology_mismatch_count_max: 0
  invalid_transition_failure_count_min: 3
  inferred_scalar_count_max: 0
  epsilon_offset_abs_max: 0.0
  input_state_mutation_abs_max: 0.0

decision:
  go: >
    Every release, finite-area, injection, role, seam, rigid and fail-closed
    gate passes. Validate only the topology-changing release/newborn state
    injection, then authorize a separate coupled newborn midpoint/full
    algebraic and material-time gate.
  no_go: >
    Preserve the failed release DOF, map, role or seam. Do not add a
    geometric epsilon, average scalar rows, reuse body velocity for the
    released row, smooth the wake, relax a threshold or consult a load target.
  production_activation_allowed: false

scope_limit: >
  This gate does not solve newborn midpoint/current strength, advance more
  than one insertion event, compute pressure/force/LESP, compare experiments
  or activate production.

