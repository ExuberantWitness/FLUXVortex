    - "Named state and residual block assembly"
    - "Analytic block Jacobians"
    - "Unweighted physical-scale normalization"
    - "Backtracking Newton least-squares updates"
  forbidden:
    - "Any FLUXV physical closure, pressure or force output"
    - "Regularization, smoothing or tuneable block weights"
    - "LESP amplitude, target lift or target thrust residuals"
cases:
