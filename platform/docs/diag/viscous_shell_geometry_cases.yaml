claim: N2.6d1
status: preregistered_before_execution
target: >
  Establish a NACA-2406 upper/lower viscous wall sharing the frozen N1
  mean-camber material coordinates, without changing N1 geometry,
  circulation, pressure jump, or force.
thresholds:
  max_mid_surface_reconstruction_error: 3.0e-16
  max_director_unit_error: 3.0e-15
  maximum_thickness_ratio_error: 1.0e-4
  maximum_thickness_location_error: 2.0e-2
  rigid_transform_thickness_error: 3.0e-15
scope_limit:
  - reference NACA four-digit section and proper rigid transforms only
  - no flexible director transport or shell curvature compatibility claim
  - no boundary-layer state, separation, pressure, force, or production claim
no_go:
  - moving the frozen N1 mean-camber lattice
  - changing thickness to fit force data
  - assigning one wall normal to both physical sides
  - treating rigid-transform success as proof of flexible-shell transport
