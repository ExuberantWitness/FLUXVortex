decision:
  go: >
    Every role, mapping, old-transport, birth, algebraic, chronology,
    residual and Cauchy gate passes. Validate the actual repeated-insertion
    composition and authorize the next unified-pressure research node.
  no_go: >
    Preserve the first failed named residual and classify it under old
    transport, birth interface, algebraic trace or time composition. Do not
    tune a constant, lower a threshold, initialize newborn DOFs, remap,
    regularize or consult a load target.
  production_activation_allowed: false

scope_limit: >
  This is still a no-force actual-state oracle over a short canonical time
  window. It does not compute unified pressure, panel force, LESP, a flap
  cycle, 118 cases or production loads.

