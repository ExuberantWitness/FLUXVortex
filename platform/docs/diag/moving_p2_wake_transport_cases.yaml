  failed_gate: zero_boundaries_remain_zero
  diagnosis: >
    The unconstrained continuous-Galerkin trial space updates DOFs on
    explicitly zero physical boundaries. Boundary roles must enter as
    essential scalar traces; they cannot be expected to remain invariant
    merely because the continuum characteristic is tangent to the boundary.
  claim_effect: >
    Falsify/freeze c2b2b as unconstrained sufficiency. Open a separate
    boundary-role-constrained composition claim without changing this result
    or its thresholds.
