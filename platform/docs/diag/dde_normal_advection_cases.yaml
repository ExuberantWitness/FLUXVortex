schema_version: 1
title: "N3.1j4c2 normal-only sheet geometry advection gate"
role: >
  Mechanism-isolation follow-up to two full-vector projection NO-GOs.
  Only the continuous sheet-normal velocity changes geometry. Tangential
  reparameterization is fixed to zero and no force or pressure is computed.
prior_falsification:
  cylindrical_full_vector_time_cauchy_ratio: 1.9192947259344226
  cylindrical_full_vector_projection_residual_fraction: 0.5397190893182336
normal_ode_case:
  rate: 0.7
  source: 0.2
  final_time: 0.4
  steps: [4, 8, 16]
cylinder:
  radius: 1.0
  length: 1.0
  circumferential_nodes: 8
  axial_cells: 2
  potential_jump: "mu=y(1-y)"
self_induced_case:
  final_time: 0.01
  steps: [4, 8, 16]
  line_quadrature_orders: [48, 64]
  tangential_gauge: zero
guards:
  normal_ode_error_ratio_min: 3.8
  self_time_cauchy_ratio_min: 3.5
  self_finest_change_over_radius_max: 0.01
  quadrature_change_over_displacement_max: 0.02
  rotational_equivariance_max_abs: 1.0e-10
  normal_projection_residual_fraction_max: 0.20
  minimum_area_ratio: 0.90
  maximum_edge_length_ratio: 1.20
  potential_jump_residual_max: 1.0e-12
promotion_boundary: >
  Passing validates short-time normal geometry evolution only. Because the
  zero-tangential gauge changes parameter labels, conservative P2 potential-
  jump re-expression, shedding/bound coupling, long-time roll-up, pressure,
  force, and production remain separate blocked claims.
