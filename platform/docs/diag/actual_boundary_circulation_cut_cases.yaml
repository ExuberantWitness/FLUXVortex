  interpretation: >
    The closed single-valued trace is topologically incapable of carrying
    prescribed nonzero circulation, independent of P2 refinement.  A
    classified duplicated trace at the cut carries exactly the prescribed
    jump and circulation, and the same differentiated trace recovers the
    analytic attached pressure force.  This validates the cut requirement,
    not a three-dimensional body-wake implementation.
