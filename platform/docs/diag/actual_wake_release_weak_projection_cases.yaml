question: >
  Does the actual body-wake velocity possess a direction-independent
  pointwise trace at the retiring attachment P1/P2 nodes, or must the
  topology transition instead use a convergent global weak P1 projection of
  the sheet-normal velocity as its finite mesh gauge?

cause_from_s3y:
  data_fingerprint:
    - >
      The S3y one-sided local least-squares operator is full rank with
      condition number 13.38 and rigid error 6.66e-16, but its retained
      pointwise relative fit residual is 68.80 and its amplitude-level
      projection residual is approximately 55.2%.
    - >
      In an exploratory actual-field approach sequence with epsilon halved
      from 0.025 to 0.003125, both tip-vertex normal velocities grow from
      0.2337 to 0.4027 and their successive changes remain 0.0581, 0.0561,
      0.0548 rather than contracting.
    - >
      The two outer attachment-edge midpoint velocities also continue from
      -0.0533 to -0.0790 with successive changes 0.00911, 0.00847, 0.00809.
    - >
      Interior attachment vertices approached through different incident
      faces retain a finest-direction spread up to 0.0441.
  node: N3.1j3b6d18c2b3b3b2c1b
  movable_space: >
    Compare only two representations of the same frozen actual four-channel
    velocity: a stricter unseen point-approach sequence and a consistent
    global P1 weak normal projection assembled from owner-preserving
    quadrature. Do not change the physical velocity, P2 sheet, body solve,
    time method, geometry, or any regularization/core parameter.
  classification: wrong_pointwise_boundary_trace_hypothesis_and_missing_weak_mesh_velocity

primary_evidence:
  - source: >
      Pozrikidis, Journal of Fluid Mechanics 425 (2000) 335-366.
    doi: https://doi.org/10.1017/S0022112000002202
    implication: >
      A three-dimensional vortex sheet is evolved by the fluid velocity
      normal to the sheet while tangential marker motion is arbitrary;
      numerical vortex-sheet dynamics is singular/ill-posed beyond a limited
      interval, so a mesh-node point value is not automatically physical.
  - source: >
      DeVoria & Mohseni, Journal of Fluid Mechanics 855 (2018) 299-321.
    doi: https://doi.org/10.1017/jfm.2018.645
    implication: >
      The Birkhoff-Rott self-induced velocity is singular and finite-segment
      motion requires a bounded integral construction rather than naive
      point evaluation through the singularity.
  - source: >
      Dziuk & Elliott, Acta Numerica 22 (2013) 289-396.
    doi: https://doi.org/10.1017/S0962492913000056
    implication: >
      Evolving-surface finite elements define geometry and transport through
      variational surface integrals on the triangulated surface.
  - source: >
      Elliott & Venkataraman, NMPDE 31 (2015) 459-499.
    doi: https://doi.org/10.1002/num.21930
    implication: >
      ALE surface evolution separates the prescribed normal surface motion
      from mesh parameterization and admits a finite-element velocity field
      tied to the current triangulation.

candidates:
  point_trace:
    claim_node: N3.1j3b6d18c2b3b3b2c1b1
    approach_epsilons:
      - 0.0125
      - 0.00625
      - 0.003125
      - 0.0015625
      - 0.00078125
    observed_entities:
      - "two tip attachment vertices"
      - "four attachment edge midpoints"
      - "all incident-face directions at three interior vertices"
    pass_definition: >
      The last two differences contract by at least 1.3, the finest absolute
      change is below the entity threshold, and incident-face limits agree.
  weak_projection:
    claim_node: N3.1j3b6d18c2b3b3b2c1b2
    quadrature_orders: [3, 5, 7]
    basis: "global continuous P1 scalar normal speed"
    geometry_velocity: "sum_i N_i s_i n_i"
    objective: >
      Minimize the surface L2 error of the physical face-normal speed using
      the consistent global mass/Gram matrix; no boundary point value enters.
    pass_definition: >
      The Gram solve is full-rank, the manufactured FE field is recovered,
      the physical release coefficients contract and reach the finest
      relative-change threshold, the residual is weakly orthogonal, and the
      result is rigid-frame covariant.

