  input_state_mutation_abs_max: 0.0

decision:
  weak_go: >
    Point-trace convergence fails on the unseen finest levels while every
    weak projection gate passes. Falsify pointwise nodal release, validate
    only the weak P1 mesh-normal velocity, and authorize S3y topology
    injection to consume that weak field.
  point_go: >
    Every point-trace gate passes on unseen levels. Preserve the converged
    point trace and do not promote the weak alternative without a separate
    accuracy advantage.
  no_go: >
    If the point trace fails and the weak projection does not converge,
    preserve both failures and move to a bounded finite-segment/thin-layer
    representation. Do not add a blob/core radius, epsilon crop, filter,
    smoothing, damping or target load.
  production_activation_allowed: false

scope_limit: >
  This gate selects only the retiring-edge geometry-velocity
  representation. It does not infer newborn strength, advance time, compute
  pressure/force/LESP, compare experiments or activate production.

