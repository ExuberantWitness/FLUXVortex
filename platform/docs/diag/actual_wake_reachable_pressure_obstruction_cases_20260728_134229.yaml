    delta2; otherwise require rho=delta2/delta1<1 and use
    delta2/(1-rho).  Add the unprojected-operand round term exactly once
    when forming the interval.
  interval: >
    I_plus/minus=[max(0,norm(Pi_plus/minus*v_anchor)-U_plus/minus),
    norm(Pi_plus/minus*v_anchor)+U_plus/minus].
  parity_decision:
    resolved_failure: >
      Any odd lower bound L_minus>0, or any required projected q family that
      does not contract/plateau, is PROTOCOL-NO-GO.
    admissible: >
      L_minus=0 is reported only as NO RESOLVED SYMMETRY VIOLATION.  It is
      sufficient for this protocol hard guard but is not certified exact
      mirror symmetry.
    relative_report: >
      H_minus/L_plus may be reported only if L_plus>0.  If L_plus=0, emit
      null and never divide by an observed near-zero signal.
  local_noncancellation: >
    Also form V_minus=sum_n norm(Pi_minus*R_n) for zero histories and give it
    its own inherited dt/q/mixed/repeat/direct-observer scalar interval.
    Window cancellation may not hide stagewise odd defects.

