projected_uncertainty:
  rule: >
    Project every operand before constructing a family.  Apply the inherited
    epsilon, timestep, q, mixed-cube, repeat, and direct-observer formulas
    independently to Pi_plus and Pi_minus in the typed norm of that
    observable.
  floating_round_scale: >
    Each projected family receives one round term scaled from the
    unprojected operands in the same typed norm.  For a cancellation such as
    inventory=-body_trace+release, use the unprojected body trace and release
    operands, not the near-zero inventory alone.
  matched_stage_q_families:
    signed_positive: [Q8_plus, Q10_plus, A_plus]
    signed_negative: [Q8_minus, Q10_minus, A_minus]
    zero: [Z_Q8, Z_Q10, Z_A]
    rule: >
      At every common prestep/full, measured midpoint/full, and measured
      residual index, form q8/q10/q12 triples for canonical trace, stored
      pressure, direct pressure, stored residual, and direct residual.
      Primal trace uses M; dual fields use M^-1.
  quadrature_tail: >
