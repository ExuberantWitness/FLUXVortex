S1f_paired_level3_continuation_preregistered_after_S1e_before_execution:
  trigger: >
    Level-2/order-8 paired Galerkin reduced potential, velocity and Cp
    errors to 0.03375, 0.07857 and 0.03393.  Velocity/Cp already pass and
    the level-1 to level-2 potential reduction factor is 3.72, predicting
    that one uniform refinement can cross the unchanged 0.02 potential
    gate without an equation change.
  quadrature_qualification: >
    Before the level-3 run, recompute level 2 with target/source/pair order
    6 and require absolute changes from the formal order-8 result <=0.002
    for potential, velocity and Cp.  This uses the already-passed S1d
    order-6 to order-8 Cauchy evidence and controls the level-3 cost.
  formal:
    mesh_level: 3
    target_source_and_pair_order: 6
  unchanged_thresholds:
    offbody_potential_relative_error_max: 0.02
    surface_velocity_rms_error_max: 0.08
    surface_Cp_rms_error_max: 0.08
  required:
    - "level-2 order qualification passes all three 0.002 limits"
    - "all three level-3 errors are below the unchanged accuracy gates"
    - "weak residual, continuity, source flux and condition remain passed"
    - "paired topology counts are complete"
  decision:
    go: >
      Passing qualifies the attached unit-sphere continuous-P2/P1 weak
      potential and surface-gradient oracle at the demonstrated mesh
      resolution only.
    no_go: >
      A failed order qualification invalidates the level-3 execution.  A
      qualified but inaccurate level-3 result opens isoparametric geometry
      rather than another flat-mesh chase.
  forbidden:
    - "changing the equation, source sign or paired topology transform"
    - "loosening any threshold"
    - "claiming circulation, wake, unsteady pressure or production force"

