decision:
  zero_state_go: >
    G_A has numerical rank zero for every frozen timestep/order and the
    nonlinear reference-connected branch preserves compatibility at the
    preregistered order. Only then may the same zero-state closure continue.
  distributed_defect_go: >
    G_A is full rank seven, the analytic/finite-difference and continuation
    guards pass, and basis covariance holds. This falsifies automatic
    compatibility for this named closure and falsifies a one-global-scalar
    repair. It authorizes only a literature/derivation phase for a physical
    distributed forming-zone state.
  no_go: >
    Rank changes with quadrature/timestep, the reference is incompatible,
    the derivative or continuation checks fail, or the operator depends on
    the chosen basis. Diagnose the representation; do not add a slack state,
    least squares, deleted body rows, damping, core, clamp or load target.
  production_activation_allowed: false

