named_closure:
  name: weak_unsteady_pressure_history_closure
  equation: >
    F_P = M_a [ C phi(g) - c_previous ]
          + dt * f_a( 0.5*(|w_upper|^2-|w_lower|^2) ) = 0
  body_equation: "B phi + W_direct g = b"
  compatibility_observation: "A = g - C phi"
  notes:
    - "C is the active body-cut jump map; g is the independent current wake trace"
    - "f_a is the consistent weak active-P2 line observation, not collocation"
    - "the previous trace is an input history state, not a fitted coefficient"
    - "pressure is never integrated into force in this gate"

compatible_reference:
  body: "frozen symmetric full-wing diamond canonical"
  freestream: {speed: 1.0, alpha_deg: 0.0}
  wall_velocity: "zero"
  downstream_edge_x: 2.0
  wake_geometry: "one explicit straight material band, first two temporal rows known zero"
  attachment: "declared ordered material cut, sign +1"
  body_current_state: "Morino-compatible g0=C*phi0 using all body BIE rows"
  previous_trace: >
    c_previous0 = c0 + dt*M_a^{-1}*P0, where P0 is the weak pressure
    observation at the compatible current state. This defines an exact
    history-consistent linearization reference; it is not a production
    pressure offset. P0 must converge toward zero with boundary quadrature.

forcing_basis:
  space: "seven active P2 cut modes"
  construction: "Q = chol(M_a)^(-T), hence Q^T M_a Q = I"
  perturbation: "c_previous(epsilon,j)=c_previous0+epsilon*Q[:,j]"
  forbidden:
    - "SVD-selected physical modes"
    - "a load-derived envelope"
    - "discarding any of the seven active modes"

tangent_definition:
  reduced_jacobian: >
    J_P = M_a*C*(-B^{-1}W_direct) + dt*dP/dg
  history_response: "Dg = J_P^{-1} M_a Q"
  compatibility_map: >
    G_A = L_M^T [ I-C*(-B^{-1}W_direct) ] Dg, where
    M_a=L_M*L_M^T
  interpretation:
    rank_0: "zero-extra-state hypothesis remains eligible"
    rank_1: "a global scalar is eligible only with an independent separable physical mechanism"
    rank_gt_1: "one global scalar is structurally insufficient"
    rank_7: >
      seven distributed degrees of freedom are the minimum algebraic
      dimension for this closure, but no physical inventory is authorized
      until a finite-forming-zone/VES conservation law supplies its state,
      coupling operators and memory.

