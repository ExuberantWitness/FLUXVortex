  Starting from a body-wake compatible reference, does one explicitly named
  weak unsteady-pressure closure preserve g-Cphi=0 to first order for every
  active spanwise P2 history perturbation? If not, what is the rank of the
  compatibility-defect tangent map, and can one global scalar state span it?

