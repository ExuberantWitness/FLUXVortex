  old_state_mutation_abs_max: 0.0
  history_time_gap_abs_max: 1.0e-14
  history_geometry_gap_abs_max: 1.0e-14
  history_trace_jump_abs_max: 1.0e-14
  active_attachment_abs_max: 1.0e-12
  stage_midpoint_identity_abs_max: 0.0
  midpoint_vs_endpoint_average_difference_min: 1.0e-6
  independent_old_wake_unknown_count_max: 0
  rank_deficiency_max: 0
  normalized_weak_residual_max: 1.0e-10
  condition_number_max: 1.0e4
  tip_jump_abs_max: 1.0e-12
  maximum_band_aspect_ratio_max: 1.000000000000001
  body_jump_cauchy_contraction_min: 1.5
  body_jump_finest_relative_change_max: 0.08
  wake_probe_cauchy_contraction_min: 1.5
  wake_probe_finest_relative_change_max: 0.08

decision:
  go: >
    Every stage-origin, immutable-history, interface, rank, shape and dual
    Cauchy gate passes. GO validates only this fixed-body,
    uniform-convection explicit midpoint history and may authorize a later
    moving-geometry/equilibrium-iteration gate.
  no_go: >
    Any failed identity blocks this candidate. In particular, do not average
    endpoints, tune dt-dependent constants, smooth the wake, prescribe the
    current jump, relax a threshold, modify the frozen spatial operator, or
    use pressure/force targets. A NO-GO falsifies one explicit midpoint solve
    as sufficient and redirects the claim to within-step coupled equilibrium.
  production_activation_allowed: false

scope_limit: >
  This gate has a fixed body and prescribed uniform wake convection. It does
  not validate moving/deforming geometry, relaxed free-wake roll-up, a finite
  blunt base, LEV generation, potential time derivatives, Bernoulli
  pressure, aerodynamic force or production activation.

