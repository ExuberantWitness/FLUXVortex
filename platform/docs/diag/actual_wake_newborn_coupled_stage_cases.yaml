  initial_state: "frozen S3n two-band actual solution"
  release_geometry:
    source: "validated S3z q7 global weak P1 normal field"
    timestep: 0.01
    half_fraction: 0.5
    full_fraction: 1.0
    current_body_edge: "frozen canonical body cut"
  half_stage_rows:
    upstream: "old released body trace"
    middle: "old released body trace, explicitly known at this stage"
    current: "coupled unknown g_half"
  full_stage_rows:
    upstream: "old released body trace"
    middle: "solved g_half"
    current: "coupled unknown g_end"
  algebraic_solver:
    unknown_count: 9
    construction: "zero plus nine unit trace solves"
    verification: "one independent solved-trace evaluation"
    boundary_quadrature_order: 10
  counterfactuals:
    - "copy old trace into the half-stage current row"
    - "copy solved half trace into the full-stage current row"

required_identities:
  - "weak release field is the only geometry input"
  - "half/full augmented topologies have 63 P2 DOFs and finite area"
  - "both nine-dimensional affine trace systems are full-rank"
  - "independently evaluated half/full algebraic residuals close"
  - "all 54 non-body P2 values are preserved in every basis and verification solve"
  - "actual body-boundary weak residual and wake attachment close"
  - "newborn upstream/middle/current rows and chronological seams round-trip"
  - "solved half and endpoint traces are nontrivial"
  - "copy-old and copy-half counterfactual residuals remain observable"
  - "no point trace, averaging, clamp, inference, pressure, force or structure enters"

