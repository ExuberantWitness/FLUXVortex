decision:
  go: >
    Every weak-geometry, finite-area, affine-rank, residual, preservation,
    seam, nontriviality and counterfactual gate passes. Validate only the
    coupled half/full newborn trace solve, then authorize old-free-state
    material transport and repeated-insertion time convergence.
  no_go: >
    Preserve the failed stage/map/residual. Do not copy or average traces,
    clamp a row, add a core/epsilon/filter, alter S3z geometry, consult a
    load target, or mix in pressure/force.
  production_activation_allowed: false

scope_limit: >
  Old free P2 values are frozen during this one insertion-stage oracle.
  This gate does not prove full material transport, repeated insertions,
  time order, unified pressure/force, experimental accuracy or production.

