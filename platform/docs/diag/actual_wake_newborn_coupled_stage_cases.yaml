question: >
  On the finite half/full newborn geometries generated by the validated weak
  release field, can the newborn current P2 row be solved as the coupled
  actual body-wake algebraic trace at each stage, with all old free P2
  values preserved and without copying, averaging, clamping or inferring a
  shed strength?

cause_from_s3y_s3z:
  data_fingerprint:
    - >
      S3y proves exact 45-to-63 P2 state injection but deliberately receives
      newborn midpoint/current rows as explicit counterfactual inputs.
    - >
      S3z falsifies a pointwise attachment velocity and validates the q3/5/7
      convergent global weak P1 normal release field; geometry no longer
      blocks a finite newborn band.
    - >
      The remaining unclosed values are exactly the nine current body/newborn
      P2 trace DOFs at the half and full stages.
    - >
      S3u already falsifies endpoint copying/clamping for the fixed-topology
      actual DAE; a topology change cannot restore that invalid composition.
  node: N3.1j3b6d18c2b3b3b2c2a
  movable_space: >
    At each fixed weak-release geometry, solve only the nine-dimensional
    affine actual-boundary trace residual using zero plus unit bases and an
    independent verification solve. Keep all injected old/free P2 values
    fixed. Do not add old-state transport, a second insertion, pressure,
    force, LESP, a point trace, regularization or a target.
  classification: missing_coupled_newborn_algebraic_stage

primary_evidence:
  - source: >
      Krebs, A Distributed Doublet-Based Method for Unsteady Aerodynamic
      Analysis with Relaxed Wakes, 2021, figure 3.1 and section 3.3.
    implication: >
      Surface and newly-created wake strengths are closely intertwined and
      must be resolved before and after wake relaxation to retain tangency
      and Kutta continuity.
  - source: >
      Krebs, Bramesfeld & Cole, Aerospace 9 (2022) 28.
    doi: https://doi.org/10.3390/aerospace9010028
    implication: >
      New-row strength is assigned during its creation step and then retains
      material identity; it is not propagated from a future endpoint.
  - source: >
      Dumoulin, Eldredge & Chatelain, Journal of Fluid Mechanics 977 (2023)
      A22, equations 2.4-2.7.
    doi: https://doi.org/10.1017/jfm.2023.997
    implication: >
      Shed strength is an algebraic unknown coupled to body no-through-flow,
      Kelvin conservation and the unsteady Kutta condition.
  - source: >
      Arnold, Strehmel & Weiner, Numerische Mathematik 64 (1993) 409-432.
    doi: https://doi.org/10.1007/BF01388697
    implication: >
      Half-explicit Runge-Kutta methods require algebraic constraints to be
      solved consistently at their stages.

