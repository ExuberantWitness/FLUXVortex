question: >
  On the fixed 81-body-DOF symmetric diamond canonical, does the named
  zero-extra-state unsteady pressure law have a numerically resolved
  zeroth- or first-order residual on consecutive states generated by the
  same S3e actual-body/material-wake march?  The result is only a
  fixed-space, named-law witness.  It cannot identify a forming state,
  its dimension, a VES, or a production closure.

cause:
  data_fingerprint:
    - >
      S3ah was circular: its rank-seven result followed from the already
      assumed full-rank Morino Schur complement and supplied no physical
      state evidence.
    - >
      S3ai-v1 was rejected before execution because pressure was evaluated
      after re-solving the same BIE, its Kelvin sum telescoped by
      construction, body/direct-W quadrature orders were mixed, and its
      uncertainty combined quantities with different units.
    - >
      S3e already supplies compatible half/full body solutions and an
      immutable material history.  The missing observation is the pressure
      residual evaluated from those stored solutions, with attachment read
      independently from surface.face_mu.
  node: N3.1j3b6d18c2b3b3b2c2b2b3e3b
  movable_space: >
    Add a read-only stored-state pressure observer, a direct-W/body audit,
    and a face_mu-only attachment/orientation inventory.  Do not alter the
    S3e equations, mesh, topology, material rows, prescribed convection,
    time integrator, pressure formula, N1/N4, force, or production path.
  classifications:
    - protocol_no_go
    - fixed_space_zeroth_order_named_law_obstruction
    - fixed_space_reachable_first_order_named_law_obstruction
    - no_resolved_witness_on_this_path

primary_evidence:
  - source: >
      Dumoulin, Eldredge & Chatelain, Journal of Fluid Mechanics 977
      (2023), A22, DOI 10.1017/jfm.2023.997.
    implication: >
      No-through-flow, Kelvin circulation transfer, and the unsteady Kutta
      condition are distinct equations.  A topology identity may not be
      counted a second time as an independent physical closure.
  - source: >
      Xia & Mohseni, Journal of Fluid Mechanics 830 (2017), pp. 439-463,
      DOI 10.1017/jfm.2017.513.
    implication: >
      A massless finite-angle forming sheet couples side velocities,
      circulation rate, relative speed, and forming direction.  A residual
      witness cannot by itself authorize a free correction state.
  - source: >
      Ramesh et al., On Satisfying the Kutta Condition in Unsteady Thin
      Aerofoil Theory, arXiv:2205.08647 (2022).
    implication: >
      Smooth finite-velocity departure alone is insufficient in unsteady
      flow; the pressure-difference/circulation-release condition must be
      tested explicitly.
  - source: >
      DeVoria & Mohseni, Journal of Fluid Mechanics 866 (2019),
      DOI 10.1017/jfm.2019.134.
    implication: >
      A finite vortex-entrainment sheet requires independent surface mass,
      momentum, and entrainment balances.  It cannot be introduced by
      renaming the pressure residual.

canonical:
  body: frozen_s3a_symmetric_full_wing_diamond
  spatial_discretization:
    body_trace_dofs: 81
    complete_cut_p2_nodes: 9
    active_cut_p2_nodes: 7
    zero_tip_nodes: 2
    mesh_refinement_present: false
    scope: fixed_space_canonical_only
  wall_velocity: zero
  free_stream_speed: 1.0
  trailing_edge_x: 1.0
  prescribed_material_convection_speed: 1.0
  span_diagonal_pattern: mirror_symmetric
  measurement_time: {start: 0.0, end: 1.0}
  incident_history: >
    alpha(t;epsilon)=0 for t<=0 and
    alpha(t;epsilon)=epsilon*sin(pi*t) for 0<t<=1.  The incident velocity is
    U*(cos(alpha),0,sin(alpha)) on every body face.
  common_anchor:
    epsilon_rad: 0.0025
    timestep: 0.0625
    body_target_quadrature_order: 12
    body_source_quadrature_order: 12
    direct_w_target_quadrature_order: 12
    direct_w_source_quadrature_order: 12
    pressure_line_quadrature_order: 12
  pressure_line_rule: >
    The straight-edge P2 body-potential gradient is P1, its squared-speed
    difference is P2, and multiplication by a P2 test is P4.  Gauss order
    three is exact for this polynomial observation; order 12 is fixed and is
    not treated as an empirical convergence axis.

compatible_prestep:
  construction: >
    For every epsilon/dt/q history, call the unmodified S3e marcher over
    [-dt,1].  Step zero has alpha=0 at both half and full stages and produces
    the stored phi, zero-strength material band, and history at t=0.
    Only steps with time_previous>=0 enter the pressure window.
  external_initial_jump_role: >
    The externally supplied zero trace exists only at t=-dt and is excluded
    from every physical observation.  The t=0 full stage is the compatible
    previous state for the first measured step.
  required_checks:
    - prestep full stage stored BIE and compatibility pass
    - prestep surface-derived material trace is identically zero within scale
    - every measured previous state is the preceding stored full stage
    - no history, potential, or material array is shared between fresh runs

typed_attachment:
  class: MaterialWakeCutAttachment
  ordered_body_cut_vertex_indices: topology.ordered_cut_vertex_indices
  wake_jump_from_body_cut_sign: 1
  mapping: "w = s*P*c; canonical = s*P^T*w"
  prohibition: >
    No coordinate sort, nearest-neighbour match, cached body_cut_jump, or
    force sign may infer P or s.

surface_material_observer:
  source_of_truth: band.surface.face_mu
  forbidden_source: band.potential_jump_rows
  edge_trace_algorithm: >
    For each previous/current material vertex chain, find the unique
    boundary triangle incident on every adjacent vertex pair.  Read its two
    P2 vertex coefficients and matching edge-mid coefficient in material
    chain order.  Assemble the 2*Ns-1 row and require duplicate shared
    vertices to agree.
  band_release: "r_k = mu_current,k - mu_previous,k"
  history_release: "R_w_material = sum_k r_k"
  canonical_release: "R_w_body = s*P^T*R_w_material"
  stored_body_trace: "c = topology.cut_jump(solution.global_body_potential)"
  representation_inventory: "I_beta = -c + beta*R_w_body"
  correct_birth_sign: 1
  negative_birth_sign: -1
  incremental_guards:
    - "I_+(previous full) -> I_+(half) is zero as a complete nine-node trace"
    - "I_+(half) -> I_+(full) is zero as a complete nine-node trace"
    - "I_- excludes zero on at least one nonzero stage"
  claim_boundary: >
    This is an attachment/orientation/material-state representation guard.
    It is not a Kelvin theorem on an independently tracked closed fluid
    material loop and is not an additional state-selection equation.

stored_stage_observer:
  material_trace: >
    Extract the newest material current edge from surface.face_mu, map it to
    canonical active order with the typed attachment, and use it as g.
    Compare it with topology.cut_jump(stored phi), but never define it from
    that body trace.
  direct_equation: "B*phi + W_direct*g = b"
  primary_body_state: solution.global_body_potential
  primary_pressure: >
    Evaluate the weak active-P2 kinetic pressure from the primary stored
    body state.  No body solve is allowed inside this evaluation.
  independent_direct_audit: >
    Assemble W_direct at the exact externally typed body quadrature order,
    solve phi_d=B^-1*(b-W_direct*g), and report both stored/direct residuals,
    phi_d-phi_stored, g-C*phi_d, and componentwise backward errors.
  algebraic_cross_observer: >
    On the identical stored material trace history, replace only the
    midpoint pressure P(phi_stored) by P(phi_d).  Keep M*(g_cur-g_prev)
    unchanged.  The tangent difference is u_alg, an observer/operator
    discrepancy, not a recursively propagated trajectory error.

named_dynamic_observation:
  mass: >
    M_active is the active-active block of the complete consistent P2 line
    mass in classified cut order.
  weak_pressure: >
    P_mid=f_active[0.5*(|w_upper(phi_mid)|^2-
    |w_lower(phi_mid)|^2)] from the stored midpoint body potential.
  step_residual: "R_n=M_active*(g_current-g_previous)+dt*P_mid"
  window_residual: "R_W=sum over measured t in [0,1] of R_n"
  tangent: "Omega=[R_W(+epsilon)-R_W(-epsilon)]/(2*epsilon)"
  norm: "||x||_(M^-1)=sqrt(x^T*M_active^-1*x)"
  zero_sum: "Z0=sum_n R_n(0)"
  zero_noncancellation: "V0=sum_n ||R_n(0)||_(M^-1)"

families:
  epsilon:
    values_rad: [0.01, 0.005, 0.0025]
    fixed: {timestep: 0.0625, quadrature_order: 12}
    expected_centered_remainder_order: 2
  timestep:
    values: [0.25, 0.125, 0.0625]
    fixed: {epsilon_rad: 0.0025, quadrature_order: 12}
    expected_midpoint_order: 2
  body_and_direct_w_quadrature:
    values: [8, 10, 12]
    fixed: {epsilon_rad: 0.0025, timestep: 0.0625}
    coupling: >
      One q is passed explicitly to body target/source and direct-W
      target/source assembly.  The resulting assembly metadata must equal q.
    convergence_order_assumed: none
  adjacent_mixed_cube:
    epsilon_rad: [0.0025, 0.005]
    timestep: [0.0625, 0.125]
    quadrature_order: [12, 10]
    configurations: complete_2x2x2_cube
    assumption: >
      The measured pairwise and three-way Moebius differences over this one
      adjacent cube are used as a local mixed-tail allowance.  They are not
      a global mixed-derivative bound or a convergence theorem.
  zero_reference:
    timestep: [0.25, 0.125, 0.0625]
    quadrature_at_finest_timestep: [8, 10, 12]
    mixed_corner: {timestep: 0.125, quadrature_order: 10}
  fresh_repeat:
    cases:
      - {epsilon_rad: 0.0025, sign: 1}
      - {epsilon_rad: 0.0025, sign: -1}
      - {epsilon_rad: 0.0, sign: 0}
    rule: reconstruct_mesh_topology_march_and_every_array

uncertainty:
  same_space_only: true
  epsilon_and_timestep:
    richardson: >
      Omega_f^R=(4*Omega_f-Omega_2f)/3 and
      Omega_2f^R=(4*Omega_2f-Omega_4f)/3.
    allowance: >
      u_a=||Omega_f^R-Omega_f||+||Omega_f^R-Omega_2f^R||, a in
      {epsilon,dt}, all in the dual-mass norm.
    contraction_ratio_min: 3.2
  quadrature:
    differences: >
      delta1=||Omega_10-Omega_8|| and
      delta2=||Omega_12-Omega_10||.
    allowance: >
      If both differences are on the preregistered floating plateau, use
      delta2+u_round.  Otherwise require rho=delta2/delta1<1 and use
      u_q=delta2/(1-rho).
  mixed_cube:
    pairwise:
      - "Delta_e_dt=Omega_110-Omega_100-Omega_010+Omega_000"
      - "Delta_e_q=Omega_101-Omega_100-Omega_001+Omega_000"
      - "Delta_dt_q=Omega_011-Omega_010-Omega_001+Omega_000"
    three_way: >
      Delta_e_dt_q=Omega_111-Omega_110-Omega_101-Omega_011+
      Omega_100+Omega_010+Omega_001-Omega_000.
    allowance: sum of the four dual-mass norms
  repeat: "u_repeat=||Omega_fresh-Omega_anchor||_(M^-1)"
  algebraic_observer: >
    u_alg=||Omega_direct_phi_pressure-Omega_stored_phi_pressure||_(M^-1)
    at the common anchor.
  floating_plateau: >
    u_round=4096*eps64*max over the compared same-space vector norms.
    Exact zero differences form a separate exact plateau.  A non-plateau
    second-order family must contract by at least 3.2.
  total: "U_Omega=u_e+u_dt+u_q+u_mix+u_repeat+u_alg+u_round"
  interval: >
    [L_Omega,H_Omega]=[max(0,||Omega_anchor||-U_Omega),
    ||Omega_anchor||+U_Omega].
  zero_reference: >
    Construct U_Z and U_V independently from their dt Richardson, q tail,
    dt-q mixed corner, fresh repeat, stored/direct-pressure discrepancy, and
    floating plateau.  Never subtract Z0, V0, U_Z, or U_V from Omega.

hard_guards:
  thresholds:
    stored_bie_backward_error_max: 2.0e-11
    direct_bie_backward_error_max: 2.0e-11
    condition_times_backward_error_max: 1.0e-2
    direct_w_factorization_abs_max: 5.0e-11
    direct_w_rank_deficiency_max: 0
    stored_material_body_trace_abs_max: 2.0e-11
    direct_body_compatibility_abs_max: 2.0e-8
    zero_tip_abs_max: 2.0e-12
    surface_internal_trace_abs_max: 2.0e-12
    surface_history_seam_abs_max: 2.0e-12
    surface_row_cache_abs_max: 2.0e-12
    material_inventory_increment_abs_max: 2.0e-11
    old_state_mutation_abs_max: 0.0
    history_time_gap_abs_max: 2.0e-12
    history_geometry_gap_abs_max: 2.0e-12
    midpoint_identity_abs_max: 2.0e-12
    current_attachment_abs_max: 2.0e-12
    mirror_relative_residual_max: 2.0e-10
    negative_control_separation_ratio_min: 1.0e6
    input_mutation_abs_max: 0.0
  rules:
    - every primary pressure uses stored phi and no hidden solve
    - all measured stages use the same typed q for body and direct W
    - all BIE, compatibility, zero-tip, chronology and face_mu guards pass
    - stored/direct body solves are independently distinguishable
    - correct attachment and birth sign pass complete-trace local guards
    - wrong attachment and wrong birth sign are detected on nonzero stages
    - span-mirror symmetry passes for trace, pressure and residual
    - epsilon and timestep either contract at order-two threshold or lie on the floating plateau
    - quadrature contracts or lies on the floating plateau
    - no pressure root, least squares, force, load data, clamp, core, smoothing, or state fit enters

negative_controls:
  stored_phi_single_dof:
    action: >
      Perturb one deterministic non-gauge stored body-potential DOF only in
      the observer.
    expected: >
      Stored-state BIE and pressure change and fail their guards, while the
      independent direct solve remains at its original backward error.
  attachment_sign:
    action: use identical material history with typed sign -1
    expected: material/body compatibility fails on a nonzero stage
  birth_sign:
    action: evaluate I_beta with beta=-1
    expected: at least one complete-trace increment excludes zero
  asymmetric_permutation_roundtrip:
    action: >
      Use a manufactured nonsymmetric nine-node P2 trace, reversed material
      vertex IDs, and attachment sign -1.
    expected: canonical release is invariant only under the exact typed map
  row_surface_independence:
    action: >
      Mutate potential_jump_rows while retaining surface.face_mu, then
      mutate one surface boundary face_mu while retaining rows.
    expected: >
      The inventory follows face_mu only; the separate row/surface
      consistency guard detects both disagreements.
  local_noncancellation:
    action: use an antisymmetric local defect with zero span integral
    expected: complete-trace material guard fails despite zero scalar integral

decision:
  protocol_no_go: >
    Any hard guard, negative control, convergence family, uncertainty
    construction, or zero-reference symmetry failure blocks a physical
    classification.  Do not relax thresholds or change a physical component.
  zeroth_order_obstruction: >
    If zero-reference families converge and either
    L_Z=max(0,||Z0_anchor||-U_Z)>0 or
    L_V=max(0,V0_anchor-U_V)>0, report a fixed-space zeroth-order obstruction
    of the named pressure law.  Do not form a centered tangent conclusion.
  first_order_obstruction: >
    Only after the zero-reference intervals include zero, if L_Omega>0,
    report a fixed-space reachable first-order obstruction witness for this
    named pressure law and incidence path.
  no_resolved_witness: >
    If all protocol gates pass and L_Omega=0, report NO RESOLVED WITNESS.
    Do not call the zero-extra-state closure validated.
  next_mechanism_gate: >
    No geometry-versus-VES decision is allowed until a separate actual-body
    spatial h/p refinement reproduces the witness.  If it does, test the
    parameter-free Xia-Mohseni massless forming geometry before any finite
    VES state.
  production_activation_allowed: false

formal_execution:
  allowed_after:
    - timestamped file exists before runner implementation is executed
    - schema and definition audit pass
    - all unit and negative-control tests pass
    - independent code audit finds no self-reference
  result_file: actual_wake_reachable_pressure_obstruction_results_20260728_131922.json
  latest_result_file: actual_wake_reachable_pressure_obstruction_results.json

nonclaims:
  - no spatial mesh h/p refinement is present
  - prescribed uniform x convection is not actual roll-up
  - the face_mu inventory is not an independent global Kelvin loop
  - the adjacent mixed cube is only a local numerical allowance
  - u_alg is not an exact-arithmetic trajectory error bound
  - one incidence direction does not identify obstruction rank or state dimension
  - a nonzero witness does not distinguish forming geometry from finite VES
  - no force, panel load, LEV amplitude, 118 sweep, or Fig17/18/19 result is produced
