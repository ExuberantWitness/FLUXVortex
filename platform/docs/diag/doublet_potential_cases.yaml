claim: N3.1j3b2
status: preregistered_before_execution
target: >
  Establish a no-force scalar-potential observer for the existing P2 DDE
  state: its numerical gradient must match the independently implemented
  DDE velocity, its planar owned principal value must be finite, and its
  Plemelj jump must preserve the frozen N1/DDE sign chi=-mu_DDE.
thresholds:
  max_gradient_velocity_abs_residual: 2.0e-9
  max_gradient_velocity_rel_residual: 2.0e-8
  max_planar_principal_value_residual: 1.0e-15
  max_plemelj_jump_residual: 1.0e-15
scope_limit:
  - CPU area-quadrature equation oracle only
  - strict owner-interior sheet points only
  - no curved multi-patch convergence or material time derivative
  - no pressure gradient, wall source, boundary layer, force, or production claim
no_go:
  - adding a core, offset, singularity cutoff, or fitted self term
  - changing the frozen chi=-mu_DDE interface sign
  - using the pressure or force target in the potential operator
