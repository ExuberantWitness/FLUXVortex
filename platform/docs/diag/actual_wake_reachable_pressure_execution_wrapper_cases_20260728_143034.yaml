  runtime_identity:
    bind_before_authorization:
      - sys.executable and /proc/self/exe path-byte SHA256 plus matching device/inode
      - Python implementation and full version
      - byte order and float64 machine constants
      - numpy version, package path, package-file SHA256, and build-config digest
