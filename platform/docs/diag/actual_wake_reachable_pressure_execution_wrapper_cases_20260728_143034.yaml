      - each case contains all five frozen value_hashes
      - each case contains all fourteen extended value hashes
      - mass_active values are present so their serialized hash is independently recomputable
      - code_fingerprints equals the 63-file start closure
      - runtime identity equals the authorization-bound identity
      - all extended hashes and observation_payload_sha256 survive JSON round-trip recomputation
    authorization_receipt:
      - raw and canonical authorization digests
      - wrapper-definition digest
      - bounded-review request and response digests
      - single-use token digest
      - start and end execution-input fingerprints
    scientific_boundary: >
      The wrapper records PROTOCOL-NO-GO, zeroth-order obstruction,
      first-order witness, or no-resolved-witness exactly as returned by the
      frozen aggregator.  It may not turn a failed guard into an exception that
      erases the evidence or into a physical-state claim.

