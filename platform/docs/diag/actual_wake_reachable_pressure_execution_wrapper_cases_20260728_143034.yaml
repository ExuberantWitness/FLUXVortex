      - NPY_DISABLE_CPU_FEATURES
      - OPENBLAS_CORETYPE
      - MKL_CBWR
      - OMP_DYNAMIC
      - OMP_PROC_BIND
      - OMP_PLACES
      - process CPU affinity
      - floating-point rounding mode
    rule: >
      The wrapper does not set or tune any runtime variable.  It only compares
      the observed runtime identity with the second-audit authorization ticket
      and fails before the attempt marker on any drift.
    source_execution_mode: >
      The formal process must start with -B and
      -X pycache_prefix=<repo>/.one_shot_no_bytecode_cache while that fixed
      cache path is absent.  A fixed stdin bootstrap opens the wrapper with
      O_NOFOLLOW, reads it once, hashes and compiles those identical bytes,
      registers that module in sys.modules, and injects only the observed
      wrapper SHA256.  The wrapper records this condition before importing the
      frozen runner, brackets all 62 dependent-source hashes around that
      import, and rejects any later disk mismatch; audited source bytes, not a
      stale cache or post-import deployment, must supply executable code.

  authorization_ticket_schema:
    required:
      - exact artifact, version, status, and unique authorization id
      - exact wrapper-definition file and SHA256
      - exact frozen four-artifact definition chain
      - exact ordered 31-case names and deterministic case-identity SHA256 values
      - exact 63-file execution source closure and SHA256 values
      - canonical digests of the source map, runtime identity, case registry, and definition chain
      - second bounded audit request/response paths and raw SHA256 values
      - parsed structured clearance with genuine cross-family independence and accepted verdict
      - second-audit 32-byte bearer-token digest with the preimage supplied out of band
      - external raw authorization SHA256 supplied by the caller
      - explicit decision YES_ONE_SHOT_31_HISTORY_ONLY
      - exact canonical result path and permanent marker path
      - single-use token digest
      - formal_execution_allowed true and execution_limit 1
      - explicit scope exclusions
      - canonical authorization digest
    canonical_digest: >
      Parse YAML, replace authorization.canonical_sha256 by 64 ASCII zeroes,
      serialize as sorted compact JSON with allow_nan=false, and SHA256 the
      resulting bytes.  Raw authorization-file SHA256 is observed separately
      in the result; no impossible raw self-hash is required.
    external_trust_anchor: >
      run_authorized_once requires both the expected raw authorization SHA256
      and the 32-byte second-audit bearer-token preimage as caller arguments.  Neither
      value may be read from an environment variable or inferred from the
      authorization file.  The ticket stores only the token SHA256.
    formal_cli: >
      Invoke this same wrapper through the fixed no-follow read-hash-compile
      Python -c bootstrap under the required -B/-X source mode, pass only
      --expected-authorization-sha256 on argv, and provide the
      64-hex-character token preimage on standard input.  No additional local
      launcher file is allowed because it would change the execution identity.
    trust_boundary: >
      Hash and schema checks prevent accidental drift and wrong-snapshot
      execution; they are not a cryptographic signature against a malicious
      writer who can change code, ticket, traces, and manifest together.
      Execution acceptance therefore remains an external research-governance
      verdict from the second bounded audit (and, if required by the user, a
      human-supplied clearance), not a self-issued machine claim.  The
      one-shot property is local to this exact, non-snapshotted and
      non-rolled-back filesystem instance under a stable package environment;
      VM/filesystem rollback or global distributed consumption requires an
      external append-only ledger and is outside this local wrapper.  The
      wrapper gates acceptance and canonical publication of formal evidence;
      it cannot revoke Python-level access to the frozen module's private
      collector, and a direct private call has no authorization receipt and
      cannot become accepted formal evidence.
    structured_second_audit_clearance:
      serialization: exact_UTF-8_JSON_object_without_markdown_fences
      required_fields:
        - artifact S3ai-v2.2-one-shot-execution-clearance
        - version 1
        - verdict ACCEPT_EXACT_ONE_SHOT_31_HISTORY_EXECUTION
        - actual_independence genuine-cross-family
        - reviewed wrapper and preregistration SHA256 values
        - canonical 63-source-map SHA256
        - canonical runtime-identity SHA256
        - canonical ordered-registry SHA256
        - canonical frozen-definition-chain SHA256
        - single-use bearer-token SHA256 commitment
        - authorization_ticket_creation_allowed true
        - formal_execution_allowed true
        - execution_limit 1
        - production_activation_allowed false
        - force_hp_state_ves_118_fig_allowed false
        - empty blocking_findings
      rule: >
        The wrapper parses the traced response itself and compares every
        binding with observed inputs; copying verdict or independence strings
        into the local ticket is insufficient.
    outcome_dependent_values: >
      Per-history array value hashes cannot be bound before the only formal
      observation without fabricating its outcome.  Instead the ticket binds
      the required value-hash schema.  The wrapper preserves the frozen five
      hashes and adds hashes observed directly from each frozen observation for
      every array listed under extended_value_hash_schema.
    extended_value_hash_schema:
      - mass_active
      - stage_times
      - measurement_times
      - stored_window_residual
      - direct_window_residual
      - stored_step_residuals
      - direct_step_residuals
      - canonical_material_current_trace
      - body_cut_trace
      - canonical_material_release
      - representation_inventory
      - stored_weak_pressure
      - direct_weak_pressure
      - stage_roles_canonical_JSON

  one_shot_semantics:
    - missing authorization ticket fails before frozen loader or mesh
    - invalid ticket or any fingerprint drift fails before attempt-marker creation
    - result or marker already present fails before frozen loader or mesh
    - the exclusive marker consumes the authorization even if computation crashes
    - marker content SHA256 plus created device/inode/size remain invariant through publication
    - a crash or protocol result may not be silently retried with the same ticket
    - PROTOCOL-NO-GO is a valid scientific outcome and must still be persisted
    - all fixed files are opened no-follow
    - one output-directory descriptor is held from marker claim through marker recheck and no-replace result publication
    - canonical marker and result parent identities are checked before claim and before and after publication
    - execution_limit one is bound to the authorized repository path and device/inode identity

  atomic_publication:
    temporary_file: same_directory_O_CREAT_plus_O_EXCL
    serialization: UTF-8_sorted_keys_allow_nan_false_indent_2_trailing_newline
    durability:
      - fsync temporary file
      - keep the verified temporary inode open through the no-replace hard link
      - recheck marker content and inode immediately before publication
      - atomically hard-link temporary inode to the absent canonical result path
      - verify canonical result and temporary descriptor name the same inode and bytes
      - fsync result directory
      - unlink temporary name and fsync result directory again
    prohibition: >
      Do not use os.replace for final publication because it can overwrite a
      result created by a concurrent or external process.

  result_obligations:
    structural:
      - protocol_version is S3ai-v2.2
      - production_activation_allowed remains false
      - fixed_space_only is true
      - execution accounting is exactly 31/380/31/411/822/791
      - cases are the exact ordered frozen registry
