joint_decision:
  production_eligible_asset: null
  can_union_assets_for_eligibility: false
  reason: >
    No single candidate jointly supplies target-Re, moving-wall, separated,
    transitional, three-dimensional crossflow velocity time series together
    with explicit double-side wall/normal/edge identities.
request_only_candidates:
  baldan_guardone_wrles:
    title: "Wall-resolved large eddy simulations of a pitching airfoil in deep dynamic stall"
    persistent_id: "doi:10.1063/5.0252828"
    corresponding_author: "alberto.guardone@polimi.it"
    reported_reynolds: 135000
    evidence_status: >
      The paper reports three-dimensional wall-resolved LES and concludes
      that span/chord >= 1 is required for the full-cycle DSV physics. Its
      Data Availability statement says supporting data are available from
      the corresponding author upon reasonable request. No field files have
      been obtained or independently audited.
    potential_role: >
      Strongest Tier-A/three-dimensional periodic-section candidate:
      target Reynolds number, pitching wall, transition, separation and
      spanwise DSV structure. It cannot by itself validate finite-wing-tip
      crossflow unless the released domain and boundary conditions provide it.
  sudharsan_sharma_bef_wrles:
    title: "A vorticity-based criterion to characterise leading edge dynamic stall onset"
    persistent_id: "doi:10.1017/jfm.2021.1149"
    reported_reynolds: "moderate/high-Re wall-resolved LES cases"
    evidence_status: >
      The paper and ALCF/OSTI records establish fine wall-resolved LES near
      stall onset, but no independently downloadable raw field archive was
      found in this audit.
    potential_role: >
      Near-leading-edge wall-vorticity/BEF event validation; not a substitute
      for a full-cycle spatial LEV and finite-wing field.
