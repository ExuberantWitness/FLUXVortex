  expected_global_p2_dof_count: 45
  expected_body_p2_dof_count: 9
  expected_free_p2_dof_count: 36
  free_mass_rank_deficiency_max: 0
  normalized_mass_boundary_coupling_min: 1.0e-8
  algebraic_body_trace_response_abs_min: 1.0e-8
  algebraic_response_linearity_relative_max: 2.0e-10
  correct_free_block_normalized_residual_max: 2.0e-12
  sequential_clamp_normalized_residual_min: 0.99
  actual_boundary_relative_weak_residual_max: 2.0e-12
  input_state_mutation_abs_max: 0.0

decision:
  coupled: >
    All identities pass. Classify the actual stage as a coupled
    differential-algebraic time problem and preregister constraint-consistent
    half-explicit RK versus present/averaged-time implicit residual methods.
    Do not authorize a solve-then-clamp composition.
  uncoupled: >
    A zero M_fb or zero algebraic response disproves the assumed two-way
    coupling on this state. Preserve the result and localize the missing
    direction before choosing a time algorithm.
  no_go: >
    Rank, linearity, weak-residual or mutation failure invalidates the audit.
    Do not tune amplitudes, relax thresholds or use a load observable.
  production_activation_allowed: false

scope_limit: >
  This audit contains no actual velocity evaluation, geometry/scalar update,
  timestep, nonlinear iteration, pressure, force, LESP, target load or
  structural dynamics.

