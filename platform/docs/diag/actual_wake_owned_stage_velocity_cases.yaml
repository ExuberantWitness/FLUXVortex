    rotation_deg: 33.0
    translation: [0.6, -0.2, 0.5]

required_identities:
  - "geometry and P2 queries reconstruct every owned physical point"
  - "free P1 geometry velocity is normal-only"
  - "body-attachment P1 velocity equals supplied body kinematics exactly"
  - "duplicated chronological seam vertices receive one global velocity"
  - "open projector equals frozen closed projector on a valid shared range"
  - "owner-fed P2 mass/advection equals the frozen assembler on a shared range"
  - "actual four-channel P2 query is finite and its ledger closes exactly"
  - "actual owner-fed P2 mass matrix is full rank and preserves constants"
  - "proper rigid transformation rotates geometry velocity and preserves scalar matrices"
  - "wrong owner, wrong body velocity and mismatched velocity/query fail closed"
  - "no continuous full-vector P1 fit, coordinate owner inference or load target enters"

