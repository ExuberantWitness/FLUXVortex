  rigid_projection_abs_max: 2.0e-10
  rigid_mass_abs_max: 2.0e-12
  rigid_advection_abs_max: 2.0e-12
  invalid_input_failure_count_min: 3
  coordinate_owner_inference_count_max: 0

decision:
  go: >
    Every owner, geometry, body boundary, seam, shared-range equivalence,
    actual-field, rigid and fail-closed gate passes. Validate only the fixed
    stage spatial discretization and authorize time-algorithm preregistration.
  no_go: >
    Any failure keeps b2b open. Preserve whether it occurs in ownership,
    projection, body boundary, P2 assembly, actual field or objectivity.
    Do not revive full-vector P1 projection, infer owner from coordinates,
    add a core, relax thresholds or use pressure/force targets.
  production_activation_allowed: false

scope_limit: >
  This gate does not update geometry or P2 scalar state, classify actual
  inflow signs, apply an essential scalar rate, solve a relaxation stage,
  compute pressure/force/LEV or activate production.

