question: >
  On the validated S3s typed actual-wake topology, can explicit owned
  patch/face/barycentric queries feed the same four-channel physical velocity
  into (a) free-P1 vertex-star normal geometry projection with a prescribed
  body-attachment velocity and (b) consistent global-P2 relative-tangential
  transport assembly, without reviving continuous full-vector P1 projection?

cause_from_s3r_s3s:
  data_fingerprint:
    - "S3s removed the one-sided-open-boundary topology blocker exactly."
    - >
      S3n publishes four owned strict-interior points per face, which match
      the frozen c5 vertex-star geometry identity.
    - >
      consistent P2 transport evaluates a higher-order face quadrature, but
      its frozen callback receives bare coordinates and cannot select the
      Birkhoff-Rott owner limit.
    - >
      the newest P1 edge is an essential body geometry boundary; projecting
      fluid velocity there would undo c2a.
    - >
      N3.1j4c1 already falsified forcing all three sheet-average velocity
      components into one continuous P1 field.
  node: N3.1j3b6d18c2b3b2b
  movable_space: >
    Add only an owner-preserving quadrature contract, an open-boundary
    free-P1 vertex-star normal projection and an owner-fed copy of the frozen
    consistent-P2 matrix assembly. Body-edge P1 velocity is prescribed by
    kinematics. Do not change any field channel, singular operator, P2 weak
    form, quadrature rule, material row, geometry, pressure or force.
  classification: missing_owner_aware_stage_discretization

primary_evidence:
  - source: >
      Krebs dissertation (2021), figures 3.4, 3.6 and 3.7.
    implication: >
      Wake vertices are moved with local velocity, while multiple interior
      control points per element support the high-order distributed field.
  - source: >
      Ambrose, The velocity field and Birkhoff-Rott integral for non-decaying
      periodic vortex sheets, SIAM J. Appl. Math. 85 (2025).
    doi: https://doi.org/10.1137/24M164848X
    implication: >
      The on-sheet geometric velocity is an explicitly defined mean limit;
      owner/side identity cannot be recovered from a bare coincident point.
  - source: >
      Erickson, Panel Methods: An Introduction, NASA TP-2995 (1990).
    url: https://ntrs.nasa.gov/citations/19910009745
    implication: >
      Edge/on-panel velocity limits require explicit element-side treatment,
      motivating strict interior owned evaluation.
  - source: >
      Elliott & Venkataraman, NMPDE 31 (2015) 459-499.
    doi: https://doi.org/10.1002/num.21930
    implication: >
      ALE scalar transport consumes the relative tangential field on the
      current triangulation; it is distinct from the mesh geometry velocity.

candidate_rewrite: >
  Use WakeSheetQuery ownership for both the frozen four-point geometry query
  and arbitrary triangle quadrature. Project only free-P1 normal speed by
  local vertex-star affine extrapolation; insert the supplied body-edge
  kinematic velocity exactly. At P2 quadrature, subtract the P1 mesh velocity
  from the four-channel material velocity, project the remainder tangentially
  inside the unchanged consistent mass/advection assembly, and retain the
  maximum discarded normal residual as a diagnostic.

