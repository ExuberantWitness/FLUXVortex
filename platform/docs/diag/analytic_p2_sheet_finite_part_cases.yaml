primary_evidence:
  - source: >
      Montanelli, Collino & Haddar, SIAM Journal on Scientific Computing 46
      (2024)
    doi: https://doi.org/10.1137/23M1605594
    implication: >
      Strongly singular quadratic-triangle integrals are regularized by
      Taylor subtraction and continuation into one-dimensional boundary
      terms.
  - source: Johnson, NASA CR-3079 (1980), Appendix D
    url: https://ntrs.nasa.gov/citations/19800015776
    implication: >
      The remaining polynomial doublet velocity influence terms possess
      closed endpoint H/F recursions.

candidate_rewrite:
  local_identity: >
    On each edge use physical coordinate u from the target's line
    projection.  The linear area-vorticity numerator times the radial vector
    is quadratic, so its nonlogarithmic term consumes I0/I1/I2.  The constant
    gamma-at-target term is linear and consumes J0/J1.
  exact_moments:
    I0: "integral du/r^3"
    I1: "integral u du/r^3"
    I2: "integral u^2 du/r^3"
    J0: "integral log(r/Lref) du/r^3"
    J1: "integral u*log(r/Lref) du/r^3"
  invariants:
    - "analytic area term plus validated boundary vortex equals the same finite-part identity"
    - "constant gamma and zero gamma limits remain exact"
    - "no core, offset, excluded disk, smoothing or target load"
    - "targets on an edge fail closed"

